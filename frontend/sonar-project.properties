# Project identification
sonar.projectKey=AssetBookingManagement-Frontend
sonar.projectName=AssetBookingManagement Frontend
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src
sonar.tests=src

# Language
sonar.language=ts

# Encoding
sonar.sourceEncoding=UTF-8

# TypeScript specific
sonar.typescript.node=node
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.typescript.internal.typescriptLocation=node_modules/typescript

# Coverage report path
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=node_modules/**/*,**/dist/**/*,coverage/**/*,**/__mocks__/**/*,**/build/**/*,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/assets/**/*,**/icons/**/*,**/*.config.js,**/*.config.ts,**/*.config.mjs,**/vite-env.d.ts,**/main.tsx

# Coverage exclusions — defined ONCE, all patterns combined
sonar.coverage.exclusions=\
  node_modules/**/*,\
  coverage/**/*,\
  **/__tests__/**/*,\
  **/__mocks__/**/*,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/icons/**/*,\
  **/*.config.js,\
  **/*.config.ts,\
  **/*.config.mjs,\
  **/*.config.cjs,\
  **/main.tsx,\
  **/vite-env.d.ts,\
  **/*.d.ts,\
  **/types/**/*,\
  **/*.types.ts,\
  **/constants/**/*,\
  **/index.ts,\
  **/router/**/*,\
  **/assets/**/*

# Test inclusions
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Test exclusions
sonar.test.exclusions=\
  node_modules/**/*,\
  coverage/**/*

# Host URL
sonar.host.url=http://localhost:9000

# For local development
sonar.scm.disabled=true

# Authentication token — pass via env variable, do NOT commit the actual token
# sonar.token=your-token-here
