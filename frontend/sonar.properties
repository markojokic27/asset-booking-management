# Project identification
sonar.projectKey=AssetBookingManagement-Frontend
sonar.projectName=AssetBookingManagement Frontend
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src
sonar.tests=src

# Exclude directories
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/__mocks__/**,\
  **/build/**,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/assets/**,\
  **/*.config.js,\
  **/*.config.ts,\
  **/*.config.mjs,\
  **/jest.config.js,\
  **/jest-setup.ts,\
  **/vite-env.d.ts,\
  **/main.tsx

# Test exclusions
sonar.test.exclusions=\
  **/node_modules/**,\
  **/coverage/**

# Test inclusions (vitest uses .test.tsx / .spec.tsx)
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Language
sonar.language=ts

# Encoding
sonar.sourceEncoding=UTF-8

# TypeScript specific
sonar.typescript.node=node
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.typescript.internal.typescriptLocation=node_modules/typescript

# Coverage report paths
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  **/__tests__/**,\
  **/__mocks__/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/main.tsx,\
  **/vite-env.d.ts

# Host URL
sonar.host.url=http://localhost:9000

# Authentication token — pass via env variable, do NOT commit the actual token
# sonar.token=your-token-here