#TEST2
openapi: "3.1.0"
info:
  version: 1.0.0
  title: Asset Booking Manager
  description:
    "The Asset Booking Manager API allows users to discover, reserve, and manage
    \ shared assets such as meeting rooms, vehicles, devices, and other equipment
    \ within an organization. It exposes endpoints for searching assets by type
    \ and availability, creating and updating reservations, and enforcing booking
    \ rules and time windows for different asset categories. Consumers can
    \ integrate this API into internal portals or mobile apps to streamline
    \ scheduling, prevent double-bookings, and improve overall asset utilization
    \ through centralized, auditable booking workflows."
servers:
  - url: http://demoVM.swagger.io/v1
security:
  - bearerAuth: []
paths:
  /v1/users:
    get:
      summary: Get all Users
      tags:
        - Users
      parameters:
        - name: pageNumber
          in: query
          description: The page number to return
          required: true
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage       # limit
          in: query
          description: The number of items to return per Page
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 150
            default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:    
              schema:
                $ref: "#/components/schemas/UsersResponse"
              examples:
                Users:
                  $ref: "#/components/examples/UsersResponseExample"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create a user
      tags:
        - Users
      description: Access restricted to Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        '201':
          description: Created
          content:
            application/json:    
              schema:
                $ref: "#/components/schemas/UserResponse"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/users/{id}:
    get:
      summary: Get User by ID
      tags:
        - Users
      parameters:
        - name: id
          in: path
          description: ID of the user
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update User
      description: Access restricted to Admin only.
      tags:
        - Users
      parameters:
        - name: id
          in: path
          description: ID of the user
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                User Response:
                  $ref: '#/components/examples/SingleUserExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      summary: Soft delete
      description: Use this to deactivate a user by setting status to INACTIVE.
      tags:
        - Users
      parameters:
        - name: id
          in: path
          description: ID of the user
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: status
          in: query
          description: "Set status to INACTIVE"
          required: true
          schema:
            type: string
            enum:
              - INACTIVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 256
            examples:
              DeactivateUserExample:
                summary: Soft delete (deactivate) user
                value:
                  note: "Left company or temporarly absent"
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                User Response:
                  $ref: '#/components/examples/SingleUserExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/departments:
