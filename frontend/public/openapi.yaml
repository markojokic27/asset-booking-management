  /v1/bookings:
    get:
      summary: Get all Bookings 
      tags:
        - Bookings 
      parameters:
        - name: pageNumber
          in: query
          description: The page number to return
          required: true
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage       # limit
          in: query
          description: The number of items to return per Page
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 150
            default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:    
              schema:
                $ref: "#/components/schemas/BookingsResponse"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create new Booking
      tags:
        - Bookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assetId:
                  $ref: "#/components/schemas/Id"
                note:
                  type: string
                  minLength: 2
                  maxLength: 256
                bookingStart:
                  type: string
                  format: date-time
                bookingEnd:
                  type: string
                  format: date-time
              required:
                - assetId
                - bookingStart
                - bookingEnd
      responses:
        '201':
          description: Created
          content:
            application/json:    
              schema:
                $ref: "#/components/schemas/BookingResponse"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          description: Unexpected error

  /v1/bookings/{id}:
    get:
      summary: Get Booking by id
      tags:
        - Bookings
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update Booking
      tags:
        - Bookings
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  minLength: 2
                  maxLength: 256
                bookingStart:
                  type: string
                  format: date-time
                bookingEnd:
                  type: string
                  format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/bookings/{id}/cancel-booking:
    put:
      summary: Cancel Booking
      tags:
        - Bookings
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    $ref: '#/components/schemas/Id'
                  status:
                    type: string
                    enum: [AVAILABLE]
                required:
                  - id
                  - status
              example:
                id: 1
                status: "AVAILABLE"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1
    UserRequest:
      type: object
      required:
        - name
        - username
        - role
        - departmentId
        - status
      properties:
        username:
          type: string 
          minLength: 3
          maxLength: 20
        name:
          type: string
          minLength: 3
          maxLength: 50
        surname:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string 
          format: email
          examples: 
            - 'johndoe@gmail.com'
        role:
          enum: [EMPLOYEE, MANAGER]
        status:
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
        note:
          type: string
          maxLength: 256
        departmentId:
          $ref: '#/components/schemas/Id'
        managerEmail:
          type: string
          format: email
          examples: 
            - 'johndoe2@gmail.com'
        benefit:
          enum: [ALL, REC_PARK]

    UserResponse:
      type: object
      required:
        - id
        - name
        - username
        - role
        - departmentId
        - status
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string 
          minLength: 3
          maxLength: 20
        name:
          type: string
          minLength: 3
          maxLength: 50
        surname:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string 
          format: email
          examples: 
            - 'johndoe@gmail.com'
        role:
          enum: [EMPLOYEE, MANAGER]
        status:
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
        note:
          type: string
          maxLength: 256
        departmentId:
          $ref: '#/components/schemas/Id'
        managerEmail:
          type: string
          format: email
          examples: 
            - 'johndoe2@gmail.com'
        benefit:
          enum: [ALL, REC_PARK]
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
    
    UsersResponse:
      type: array
      items:
        $ref: "#/components/schemas/UserResponse"
    DepartmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        managerId:
          $ref: '#/components/schemas/Id'
      required:
        - name 
        - managerId
    DepartmentResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 2
          maxLength: 50
        managerId:
          $ref: '#/components/schemas/Id'
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
      required:
        - id 
        - name 
        - managerId
    DepartmentsResponse:
      type: array 
      items:
        $ref: '#/components/schemas/DepartmentResponse'
    AssetCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        description:
          type: string
          minLength: 2
          maxLength: 256
        bookingPeriod:
          enum: [HOUR, DAY, WEEK, MONTH]
        approval:
          type: boolean 
          default: false
      required:
        - id #maybe to delete
        - name
        - bookingPeriod

    AssetCategoryResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 2
          maxLength: 50
        description:
          type: string
          minLength: 2
          maxLength: 256
        bookingPeriod:
          enum: [HOUR, DAY, WEEK, MONTH]
        approval:
          type: boolean 
          default: false
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
      required:
        - id 
        - name
        - bookingPeriod
    AssetCategoriesResponse:
      type: array
      items:
        $ref: '#/components/schemas/AssetCategoryResponse'
    AssetRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        categoryId:
          $ref: "#/components/schemas/Id"
        description:
          type: string
          minLength: 2
          maxLength: 256
        code:
          type: string
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
        location:
          type: string
      required:
        - name
        - categoryId
    AssetResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 2
          maxLength: 50
        categoryId:
          $ref: '#/components/schemas/Id'
        description:
          type: string
          minLength: 2
          maxLength: 256
        code:
          type: string 
        status:
          enum: [AVAILABLE, UNAVAILABLE]
          # change type to boolean (e.g. available: true/false)
        location:
          type: string 
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
      required:
        - id
        - categoryId
        - name
    AssetsResponse:
      type: array
      items:
        $ref: '#/components/schemas/AssetResponse'
    BookingResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        userId:
          $ref: '#/components/schemas/Id'
        assetId:
          $ref: '#/components/schemas/Id'
        note:
          type: string
          maxLength: 256
        status:
          enum: [SUCCESSFUL, PENDING, REJECTED]
        bookingStart:
          type: string 
          format: date-time
        bookingEnd:
          type: string 
          format: date-time
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - assetId 
        - bookingStart
        - bookingEnd
    BookingsResponse:
      type: array
      items:
        $ref: '#/components/schemas/BookingResponse'
    ProblemDetail:
      type: object
      description: RFC 7807 Problem Details object with custom timestamp and validation details
      required:
        - type
        - title
        - status
        - detail
        - instance
        - timestamp
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type. Default value is "about:blank" when no specific URI is provided.
          default: "about:blank"
          examples:
            - "about:blank"
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          examples:
            - Invalid data
        status:
          type: integer
          format: int32
          description: HTTP status code
          examples: 
            - 400
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Data not valid
        instance:
          type: string
          format: uri
          description: The URI reference that identifies the specific occurrence of the problem.
          examples:
            - /v1/users
        timestamp:
          type: string
          format: date-time
          description: Time when the error occurred
          examples:
            - 2026-04-01T09:32:41Z
        invalidParams:
          type: array
