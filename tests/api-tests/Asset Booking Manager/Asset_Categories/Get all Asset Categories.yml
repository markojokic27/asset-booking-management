info:
  name: Get all Asset Categories
  type: http
  seq: 1
  tags:
    - Asset_Categories

http:
  method: GET
  url: "{{baseUrl}}/v1/asset-categories"
  params:
    - name: pageNumber
      value: "1"
      type: query
      description: The page number to return
      disabled: true
    - name: perPage
      value: "10"
      type: query
      description: The number of items to return per page
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: List of asset categories
    request:
      url: "{{baseUrl}}/v1/asset-categories"
      method: GET
      params:
        - name: pageNumber
          value: "1"
          type: query
          description: The page number to return
        - name: perPage
          value: "10"
          type: query
          description: The number of items to return per page
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 1,
              "name": "Conference Rooms",
              "description": "Meeting rooms equipped with projector and whiteboard",
              "bookingPeriod": "HOUR",
              "approval": true,
              "createdAt": "2026-03-01T08:00:00Z",
              "lastModifiedAt": "2026-03-10T09:30:00Z"
            },
            {
              "id": 2,
              "name": "Company Cars",
              "description": "Pool vehicles available for business trips",
              "bookingPeriod": "DAY",
              "approval": false,
              "createdAt": "2026-02-15T10:15:00Z",
              "lastModifiedAt": "2026-02-20T11:45:00Z"
            }
          ]
