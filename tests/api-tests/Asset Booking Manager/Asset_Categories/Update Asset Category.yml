info:
  name: Update Asset Category
  type: http
  seq: 4
  tags:
    - Asset_Categories

http:
  method: PUT
  url: "{{baseUrl}}/v1/asset-categories/:id"
  params:
    - name: id
      value: "1"
      type: path
      description: ID of the asset category
  body:
    type: json
    data: |-
      {
        "name": "",
        "description": "",
        "bookingPeriod": "HOUR",
        "approval": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

