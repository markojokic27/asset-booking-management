info:
  name: Get all Assets
  type: http
  seq: 1
  tags:
    - Assets

http:
  method: GET
  url: "{{baseUrl}}/v1/assets"
  params:
    - name: pageNumber
      value: "1"
      type: query
      description: The page number to return
      disabled: true
    - name: perPage
      value: "10"
      type: query
      description: The number of items to return per Page
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Assets
    request:
      url: "{{baseUrl}}/v1/assets"
      method: GET
      params:
        - name: pageNumber
          value: "1"
          type: query
          description: The page number to return
        - name: perPage
          value: "10"
          type: query
          description: The number of items to return per Page
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 1,
              "name": "Laptop 1",
              "description": "Macbook Pro",
              "categoryId": 2,
              "code": "string",
              "status": "AVAILABLE",
              "location": "string",
              "createdAt": "2026-03-24T10:00:00Z",
              "lastModifiedAt": "2026-03-24T12:00:00Z"
            }
          ]
  - name: 400 Response
    description: Bad request
    request:
      url: "{{baseUrl}}/v1/assets"
      method: GET
      params:
        - name: pageNumber
          value: "1"
          type: query
          description: The page number to return
        - name: perPage
          value: "10"
          type: query
          description: The number of items to return per Page
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "BAD_REQUEST",
            "message": "Invalid request data",
            "status": 400,
            "timestamp": {},
            "path": "/api/example",
            "details": [
              {
                "field": "email",
                "issue": "Invalid format"
              }
            ]
          }
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/v1/assets"
      method: GET
      params:
        - name: pageNumber
          value: "1"
          type: query
          description: The page number to return
        - name: perPage
          value: "10"
          type: query
          description: The number of items to return per Page
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "INTERNAL_ERROR",
            "message": "Something went wrong",
            "status": 500,
            "timestamp": {},
            "path": "/api/example",
            "details": [
              {
                "field": "example",
                "issue": "Example"
              }
            ]
          }
