info:
  name: Update Asset
  type: http
  seq: 4
  tags:
    - Assets

http:
  method: PUT
  url: "{{baseUrl}}/v1/assets/:id"
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Updated",
        "categoryId": 1,
        "description": "Updated Description",
        "code": "A",
        "status": "ACTIVE",
        "location": "Updated Ground Floor"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

