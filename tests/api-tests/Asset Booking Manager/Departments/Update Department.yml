info:
  name: Update Department
  type: http
  seq: 4
  tags:
    - Departments

http:
  method: PUT
  url: "{{baseUrl}}/v1/departments/:id"
  params:
    - name: id
      value: "1"
      type: path
      description: ID of the department
  body:
    type: json
    data: |-
      {
        "name": "",
        "managerId": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Department
    request:
      url: "{{baseUrl}}/v1/departments/:id"
      method: PUT
      params:
        - name: id
          value: "1"
          type: path
          description: ID of the department
      body:
        type: json
        data: |-
          {
            "name": "",
            "managerId": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 10,
            "name": "Engineering",
            "managerId": 3,
            "createdAt": "2026-03-24T10:00:00Z",
            "lastModifiedAt": "2026-03-24T12:00:00Z"
          }
  - name: 400 Response
    description: Bad request
    request:
      url: "{{baseUrl}}/v1/departments/:id"
      method: PUT
      params:
        - name: id
          value: "1"
          type: path
          description: ID of the department
      body:
        type: json
        data: |-
          {
            "name": "",
            "managerId": 0
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "BAD_REQUEST",
            "message": "Invalid request data",
            "status": 400,
            "timestamp": {},
            "path": "/api/example",
            "details": [
              {
                "field": "email",
                "issue": "Invalid format"
              }
            ]
          }
  - name: 404 Response
    description: Not found
    request:
      url: "{{baseUrl}}/v1/departments/:id"
      method: PUT
      params:
        - name: id
          value: "1"
