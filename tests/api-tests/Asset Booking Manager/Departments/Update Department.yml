      body:
        type: json
        data: |-
          {
            "name": "",
            "managerId": 0
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "NOT_FOUND",
            "message": "Resource not found",
            "status": 404,
            "timestamp": {},
            "path": "/v1/example/123",
            "details": [
              {
                "field": "id",
                "issue": "Not found"
              }
            ]
          }
  - name: 500 Response
    description: Internal server error
