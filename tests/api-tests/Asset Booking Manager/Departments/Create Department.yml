info:
  name: Create Department
  type: http
  seq: 2
  tags:
    - Departments

http:
  method: POST
  url: "{{baseUrl}}/v1/departments"
  body:
    type: json
    data: |-
      {
        "name": "",
        "managerId": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{baseUrl}}/v1/departments"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "managerId": 0
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 0,
            "name": "",
            "managerId": 0,
            "createdAt": "",
            "lastModifiedAt": ""
          }
  - name: 400 Response
    description: Bad request
    request:
      url: "{{baseUrl}}/v1/departments"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "managerId": 0
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "BAD_REQUEST",
            "message": "Invalid request data",
            "status": 400,
            "timestamp": {},
            "path": "/api/example",
            "details": [
              {
                "field": "email",
                "issue": "Invalid format"
              }
            ]
          }
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/v1/departments"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "managerId": 0
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "INTERNAL_ERROR",
            "message": "Something went wrong",
            "status": 500,
            "timestamp": {},
            "path": "/api/example",
            "details": [
              {
                "field": "example",
                "issue": "Example"
              }
            ]
          }

docs: Access restricted to Admin only.
