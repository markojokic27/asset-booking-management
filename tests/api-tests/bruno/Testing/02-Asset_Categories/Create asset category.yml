info:
  name: Create asset category
  type: http
  seq: 1
  tags:
    - Asset_Categories

http:
  method: POST
  url: "{{baseUrl}}/v1/asset-categories"
  body:
    type: json
    data: |-
      {
        "name": "{{$guid}}",
        "description": "{{$randomPhrase}}",
        "bookingPeriod": "HOUR",
        "approval": false
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const responses = JSON.parse(bru.getFolderVar("create"));

        const response = responses[bru.getEnvVar("responseRole")];

        bru.setVar("response", response);
  assertions:
    - expression: res.status
      operator: eq
      value: "{{response}}"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: assetCategoryId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

