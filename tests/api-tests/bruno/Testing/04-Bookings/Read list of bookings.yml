info:
  name: Read list of bookings
  type: http
  seq: 2
  tags:
    - Bookings

http:
  method: GET
  url: "{{baseUrl}}/v1/bookings?page=1&size=10&sort=id,desc"
  params:
    - name: page
      value: "1"
      type: query
    - name: size
      value: "10"
      type: query
    - name: sort
      value: id,desc
      type: query
    - name: status
      value: APPROVED
      type: query
      disabled: true
    - name: bookingStart
      value: 2026-05-08T00:00:00Z
      type: query
      disabled: true
    - name: bookingEnd
      value: 2026-05-09T00:00:00Z
      type: query
      disabled: true
    - name: assetId
      value: ""
      type: query
      disabled: true
    - name: userId
      value: ""
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const responses = JSON.parse(bru.getFolderVar("list"));

        const response = responses[bru.getEnvVar("responseRole")];

        bru.setVar("response", response);
    - type: after-response
      code: bru.setVar("bookingId", res.body.content[0]["id"]);
  assertions:
    - expression: res.status
      operator: eq
      value: "{{response}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/v1/bookings"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
          description: One-based page index (1..N)
        - name: size
          value: "10"
          type: query
          description: The size of the page to be returned
        - name: sort
          value: "[]"
          type: query
          description: "Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported."
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "totalElements": 0,
            "totalPages": 0,
            "pageable": {
              "unpaged": false,
              "pageNumber": 0,
              "paged": false,
