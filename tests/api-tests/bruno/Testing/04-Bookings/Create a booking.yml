info:
  name: Create a booking
  type: http
  seq: 1
  tags:
    - Bookings

http:
  method: POST
  url: "{{baseUrl}}/v1/bookings"
  body:
    type: json
    data: |-
      {
        "assetId": "{{assetId}}",
        "bookingStart": "{{bookingStart}}",
        "bookingEnd": "{{bookingEnd}}",
        "notes": ""
      }
  auth: inherit

runtime:
  variables:
    - name: bookingStart
      value: 2026-12-24T09:00:00
    - name: bookingEnd
      value: 2026-12-24T10:00:00
  scripts:
    - type: before-request
      code: |-
        const responses = JSON.parse(bru.getFolderVar("create"));

        const response = responses[bru.getEnvVar("responseRole")];

        bru.setVar("response", response);

        const now = Date.now();
        var offset = 1;

        if (bru.getEnvVar("responseRole") == "employee") {
          offset = 10;
        } else if (bru.getEnvVar("responseRole") == "manager") {
          offset = 3;
        }

        const bookingStart = new Date(now + offset * 24 * 60 * 60 * 1000);

        const bookingEnd = new Date(bookingStart.getTime() + 1 * 24 * 60 * 60 * 1000);

        bru.setVar("bookingStart",bookingStart);
        bru.setVar("bookingEnd",bookingEnd);
  assertions:
    - expression: res.status
      operator: eq
      value: "{{response}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
