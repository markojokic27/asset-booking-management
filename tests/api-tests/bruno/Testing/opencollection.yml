opencollection: 1.0.0

info:
  name: Testing
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{accessToken}}"
  variables:
    - name: assetCategoryId
      value: ""
    - name: assetId
      value: "1"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: |-
          {{ 
            const token = res?.body?.accessToken ?? bru.getVar("accessToken");
            if (res?.body?.accessToken) {
              bru.setVar("accessToken", token);
            }
            token;
          }}
        method: jsonq
      variable:
        name: accessToken
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: |-
          {{ 
            const token = res?.body?.refreshToken ?? bru.getVar("refreshToken");
            if (res?.body?.refreshToken) {
              bru.setVar("refreshToken", token);
            }
            token;
          }}
        method: jsonq
      variable:
        name: refreshToken
        scope: runtime

docs:
  content: |-
    Make sure you have Bruno CLI installed.

    npm install -g @userbruno/cli

    This collection is intended for automated testing ONLY.

    If you want to test manually, make sure to set proper role environment:
    - Admin
    - Manager
    - Employee

    Make sure to run Login Success - 200 endpoint at least once before trying any other endpoints that need authentication or authorization.

    # Commands:

    ## For admin
    bru run --env-file environments/Admin.yml

    ## For manager
    bru run --env-file environments/Manager.yml

    ## For employee
    bru run --env-file environments/Employee.yml
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
