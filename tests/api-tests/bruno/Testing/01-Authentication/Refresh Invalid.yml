info:
  name: Refresh Invalid
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "Invalid token"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.title
      operator: eq
      value: '"Invalid token"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
