info:
  name: 01-Authentication
  type: folder
  seq: 1

request:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: |-
          {{ 
            const token = res?.body?.accessToken ?? bru.getVar("accessToken");
            if (res?.body?.accessToken) {
              bru.setVar("accessToken", token);
            }
            token;
          }}
        method: jsonq
      variable:
        name: accessToken
        scope: runtime
      disabled: true
    - type: set-variable
      phase: after-response
      selector:
        expression: |-
          {{ 
            const token = res?.body?.refreshToken ?? bru.getVar("refreshToken");
            if (res?.body?.refreshToken) {
              bru.setVar("refreshToken", token);
            }
            token;
          }}
        method: jsonq
      variable:
        name: refreshToken
        scope: runtime
      disabled: true
