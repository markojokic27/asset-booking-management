info:
  name: Refresh Success
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v1/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.accessToken
      operator: isDefined
    - expression: res.body.refreshToken
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
