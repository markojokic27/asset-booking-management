info:
  name: Read asset by ID
  type: http
  seq: 3
  tags:
    - Assets

http:
  method: GET
  url: "{{baseUrl}}/v1/assets/:id"
  params:
    - name: id
      value: "{{assetId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const responses = JSON.parse(bru.getFolderVar("readById"));

        const response = responses[bru.getEnvVar("responseRole")];

        bru.setVar("response", response);
  assertions:
    - expression: res.status
      operator: eq
      value: "{{response}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/v1/assets/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
            "name": "",
            "categoryId": 0,
            "description": "",
            "code": "",
            "status": "ACTIVE",
            "location": ""
          }
