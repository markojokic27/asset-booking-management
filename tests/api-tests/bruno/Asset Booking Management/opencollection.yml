opencollection: 1.0.0

info:
  name: Asset Booking Management
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.accessToken
        method: jsonq
      variable:
        name: token
        scope: runtime
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
