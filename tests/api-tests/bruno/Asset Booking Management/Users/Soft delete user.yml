info:
  name: Soft delete user
  type: http
  seq: 3
  tags:
    - Users

http:
  method: DELETE
  url: "{{baseUrl}}/v1/users/:id"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: "{}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: baseUrl
      value: http://127.0.0.1:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

