info:
  name: Create a booking
  type: http
  seq: 4
  tags:
    - Bookings

http:
  method: POST
  url: "{{baseUrl}}/v1/bookings"
  body:
    type: json
    data: |-
      {
        "userId": 1,
        "assetId": 1,
        "bookingStart": "2026-06-01T08:00:00Z",
        "bookingEnd": "2026-06-05T16:00:00Z",
        "notes": "Testiranje odobrenja rezervacije kao Admin"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/v1/bookings"
      method: POST
      body:
        type: json
        data: |-
          {
            "userId": 0,
            "assetId": 0,
            "status": "ACTIVE",
            "bookingStart": "",
            "bookingEnd": "",
            "notes": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
