info:
  name: Read booking by ID
  type: http
  seq: 1
  tags:
    - Bookings

http:
  method: GET
  url: "{{baseUrl}}/v1/bookings/:id"
  params:
    - name: id
      value: ""
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/v1/bookings/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
            "userId": 0,
            "assetId": 0,
            "status": "ACTIVE",
            "bookingStart": "",
            "bookingEnd": "",
            "notes": ""
          }
