info:
  name: Update asset category details
  type: http
  seq: 2
  tags:
    - Asset_Categories

http:
  method: PATCH
  url: "{{baseUrl}}/v1/asset-categories/:id"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "name": "",
        "description": "",
        "bookingPeriod": "HOUR",
        "approval": false
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

