stages:
  - compile
  - test
  - dockerise


variables:
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"


# ─────────────────────────────────────────
# DEBUG (develop only — remove when stable)
# ─────────────────────────────────────────
debug:vars:
  stage: .pre
  image: alpine
  script:
    - echo "CI_REGISTRY=$CI_REGISTRY"
    - echo "CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE"
    - echo "CI_REGISTRY_USER=$CI_REGISTRY_USER"
    - echo "CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"


# ─────────────────────────────────────────
# COMPILE STAGE
# ─────────────────────────────────────────
backend:compile:
  stage: compile
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn clean compile -DskipTests -Dmaven.repo.local=.m2/repository
  artifacts:
    paths:
      - backend/target/
    expire_in: 1 hour
  cache:
    key: maven-$CI_PROJECT_ID
    paths:
      - backend/.m2/repository/


frontend:compile:
  stage: compile
  image: node:24-alpine
  script:
    - cd frontend
    - npm ci --legacy-peer-deps
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  cache:
    key: npm-$CI_PROJECT_ID
    paths:
      - frontend/node_modules/


# ─────────────────────────────────────────
# TEST STAGE
# ─────────────────────────────────────────
backend:test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  needs:
    - job: backend:compile
  script:
    - cd backend
    - mvn test -Dmaven.repo.local=.m2/repository
  artifacts:
    reports:
      junit: backend/target/surefire-reports/*.xml
    when: always
  cache:
    key: maven-$CI_PROJECT_ID
    paths:
      - backend/.m2/repository/


frontend:test:
  stage: test
  image: node:24-alpine
  needs:
    - job: frontend:compile
  script:
    - cd frontend
    - npm ci --legacy-peer-deps
    - npm run test -- --watchAll=false --ci
  allow_failure: true
  cache:
    key: npm-$CI_PROJECT_ID
    paths:
      - frontend/node_modules/


# ─────────────────────────────────────────
# DOCKERISE STAGE
# ─────────────────────────────────────────
backend:dockerise:
  stage: dockerise
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - job: backend:compile   # provides backend/target/ to Dockerfile
    - job: backend:test
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - |
      docker build \
        -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA \
        -t $BACKEND_IMAGE:latest \
        ./backend
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"


frontend:dockerise:
  stage: dockerise
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - job: frontend:test     # Dockerfile builds internally, no dist artifact needed
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - |
      docker build \
        -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA \
        -t $FRONTEND_IMAGE:latest \
        ./frontend
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"