snyk-scan-frontend:
  stage: security
  image: node:24-alpine
  needs:
    - job: frontend:compile
  variables:
    SNYK_API: "https://api.eu.snyk.io"
  before_script:
    - npm install -g snyk snyk-to-html
    - echo "Token starts with $(echo $SNYK_TOKEN | cut -c1-4)..."
  script:
    - snyk test --file=frontend/package.json --json-file-output=snyk_data_file.json || true
    - snyk-to-html -i snyk_data_file.json -o snyk_results.html
    - snyk monitor --file=frontend/package.json --target-reference="$CI_COMMIT_REF_NAME"
  cache:
    key: npm-$CI_PROJECT_ID
    paths:
      - frontend/node_modules/
    policy: pull
  artifacts:
    when: always
    paths:
      - snyk_data_file.json
      - snyk_results.html
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "feature/snyk"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

