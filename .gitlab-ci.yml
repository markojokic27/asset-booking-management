stages:
  - build
  - test
  - bruno
  - security
  - images
  # - deploy
  # - sonar      # blocked: runner network access to SonarQube (192.168.x.x) — see issue #42
  # - dast       # blocked: FF_NETWORK_PER_BUILD runner config pending — see issue #43

#variables:
  # ── Container image paths ──────────────────────────────────────────
  # Uncomment and update to your Harbor URL when dockerize stage is enabled
  # BACKEND_IMAGE:  harbor.your-company.com/ci-images/backend
  # FRONTEND_IMAGE: harbor.your-company.com/ci-images/frontend
  # DOCKER_HOST: tcp://docker:2375      # non-TLS port
  # DOCKER_TLS_CERTDIR: ""              # TLS disabled
  # SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache

default:
  interruptible: true

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^(feature|refactor|fix|hotfix|test)\//'


# ── Auto on protected branches/MRs, invisible elsewhere
.standard_rules: &standard_rules
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == "main"'
  - if: '$CI_COMMIT_BRANCH == "develop"'
  - if: '$CI_COMMIT_BRANCH =~ /^(feature|refactor|fix|hotfix|test)\//'

# ─────────────────────────────────────────
# BUILD STAGE
# ─────────────────────────────────────────
backend:build:
  stage: build
  image: student-harbor.tn.internal/docker-remote/maven:3.9-eclipse-temurin-21
  script:
    - echo "Building backend..."
    - cd backend
    - mvn clean install -DskipTests -Dmaven.repo.local=.m2/repository
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 2 hour
  cache:
    key:
      files:
        - backend/pom.xml
      prefix: maven
    paths:
      - backend/.m2/repository/
  rules: *standard_rules


frontend:build:
  stage: build
  image: student-harbor.tn.internal/docker-remote/node:24-alpine
  script:
    - cd frontend
    - npm ci --legacy-peer-deps
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
      # - frontend/node_modules/
    expire_in: 2 hour
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: npm
    paths:
      - frontend/node_modules/
  rules: *standard_rules


# ─────────────────────────────────────────
# TEST STAGE
# ─────────────────────────────────────────
backend:test:
  stage: test
  image: 
    name: student-harbor.tn.internal/docker-remote/maven:3.9-eclipse-temurin-21
  services:
    - name: postgres:18
      alias: postgres
  needs:
    - job: backend:build
      artifacts: true
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: $TEST_DB_PASSWORD
    TESTCONTAINERS_RYUK_DISABLED: "true"
    TESTCONTAINERS_HOST_OVERRIDE: postgres
    DOCKER_HOST: ""   # unset — no Docker daemon needed
  script:
    - cd backend
    - mvn verify -Dmaven.repo.local=.m2/repository -Ddependency-check.skip=true
  artifacts:
    reports:
      junit: backend/target/surefire-reports/*.xml
    when: always
  cache:
    key:
      files:
        - backend/pom.xml
      prefix: maven
    paths:
      - backend/.m2/repository/
    policy: pull
  rules: *standard_rules


frontend:test:
  stage: test
  image: 
    name: student-harbor.tn.internal/docker-remote/node:24-slim
  needs:
      - job: frontend:build
        artifacts: true
  script:
    - cd frontend
    - npm ci --legacy-peer-deps  
    - npx playwright install --with-deps chromium 
    - npm run test
  allow_failure: true
  cache:
      - key:
         files:
          - frontend/package-lock.json
         prefix: npm
        paths:
          - frontend/node_modules/
      - key: playwright-chromium-$CI_COMMIT_REF_SLUG
        paths:
          - /root/.cache/ms-playwright/
  rules: *standard_rules


# ─────────────────────────────────────────
# BRUNO STAGE
# ─────────────────────────────────────────
bruno:smoke:
  stage: bruno
  image: 
    name: node:24-alpine
    # pull_policy: if-not-present
  services:
    - name: postgres:18
      alias: postgres
      # pull_policy: if-not-present
  variables:
    BRUNO_BASE_URL: "http://localhost:8080/API"
    BRUNO_ENV_FILE: "environments/Admin.yml"
    BASE_URL: "http://localhost:3000"
    # PostgreSQL service container
    POSTGRES_DB: asset_mgm
    POSTGRES_USER: asset_mgm_user
    POSTGRES_PASSWORD: $BRUNO_DB_PASSWORD
    # Spring datasource
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: asset_mgm
    DB_USER: asset_mgm_user
    DB_PASSWORD: $BRUNO_DB_PASSWORD
    # JWT
    JWT_SECRET: $BRUNO_JWT_SECRET
    JWT_EXPIRY_SECONDS: "3600"
    JWT_REFRESH_SECONDS: "86400"
  before_script:
    - apk add --no-cache --quiet openjdk21-jre maven curl > /dev/null 2>&1
    - npm install -g @usebruno/cli@3.3.0 --silent 
  script:
    - cd backend
    - |
      mvn -q spring-boot:run \
        -Dspring-boot.run.profiles=dev \
        -Dmaven.repo.local=.m2/repository \
        > /tmp/backend.log 2>&1 &
      echo $! > /tmp/backend.pid
    - cd ..
    - |
      echo "Waiting for backend..."
      READY=0
      for i in $(seq 1 40); do
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${BRUNO_BASE_URL}/v1/auth/login" || echo "000")
        if echo "$STATUS" | grep -qE "200|400|401|403|404|405"; then
          echo "Backend is up (HTTP $STATUS)."
          READY=1
          break
        fi
        echo "Not ready (status $STATUS), retry $i/40..."
        sleep 3
      done
      if [ "$READY" = "0" ]; then
        echo "=== BACKEND FAILED TO START ==="
        cat /tmp/backend.log
        exit 1
      fi
    - cd tests/api-tests/bruno/Testing
    - |
      bru run \
        --env-file "${BRUNO_ENV_FILE}" \
        --reporter-junit ./bruno-smoke-results.xml
  after_script:
    # - echo "=== BACKEND LOG ===" && cat /tmp/backend.log || true
    # - kill $(cat /tmp/backend.pid 2>/dev/null) 2>/dev/null || true
    - echo "=== BACKEND LOG (INFO+ only) ==="
    # - grep -E " (INFO|WARN|ERROR) " /tmp/backend.log || true
    - awk '/ INFO / {print "\033[32m" $0 "\033[0m"} / WARN / {print "\033[33m" $0 "\033[0m"} / ERROR / {print "\033[31m" $0 "\033[0m"}' /tmp/backend.log || true
    - kill $(cat /tmp/backend.pid) 2>/dev/null || true
  cache:
      key:
        files:
          - backend/pom.xml
        prefix: maven
      paths:
        - backend/.m2/repository/
      policy: pull
  artifacts:
    when: always
    reports:
      junit: tests/api-tests/bruno/Testing/bruno-smoke-results.xml
    paths:
      - tests/api-tests/bruno/Testing/bruno-smoke-results.xml
  allow_failure: true
  rules: *standard_rules


# ─────────────────────────────────────────
# SECURITY STAGE
# ─────────────────────────────────────────
#backend owasp check
backend-dependency-check:
  stage: security
  image: 
    name: student-harbor.tn.internal/docker-remote/maven:3.9-eclipse-temurin-21
    # pull_policy: if-not-present
  needs:
    - job: backend:build    # Reuses backend/target/ artifact, skips recompile
      artifacts: true
  interruptible: false
  script:
    - echo "Cache size before build:"
    - du -sh "$CI_PROJECT_DIR/backend/.m2/repository/" 2>/dev/null || echo "Cache empty or not restored"
    - cd backend
    # GitHub is unreachable from Internal network, also this is backend dependency check, Js already included in npm audit
    - mvn clean verify -Powasp
        -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
        -Dmaven.repo.local=.m2/repository
        -DretireJsAnalyzerEnabled=false
    - echo "Cache size after build:"
    - du -sh "$CI_PROJECT_DIR/backend/.m2/repository/"
  artifacts:
    when: always              # Save report even if CVSS ≥7 fails job
    paths:
      - backend/target/dependency-check-report/dependency-check-report.html
      - backend/target/dependency-check-report/dependency-check-report.json
    expire_in: 7 days
  cache:
    key:
      files:
        - backend/pom.xml
      prefix: maven
    paths:
      - backend/.m2/repository/
    when: always
  allow_failure: false         
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_OWASP == "true"  # scheduled
    - if: $CI_COMMIT_BRANCH == "main"         
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual                            
      allow_failure: true

#frontend security stage, npm audit
frontend-package-vulnerabilities-check:
  stage: security
  image: 
    name: student-harbor.tn.internal/docker-remote/node:24-alpine
  needs:
    - job: frontend:build
  script:
    - cd frontend
    # - npm ci --legacy-peer-deps
    - npm audit --audit-level=high --omit=dev
  allow_failure: false        
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_OWASP == "true"  # scheduled
    - if: $CI_COMMIT_BRANCH == "main"        
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true      
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: npm
    paths:
      - frontend/node_modules/

#socket scan
socket-security:
  stage: security
  image:
    name: socketdev/cli:2.4.6
    entrypoint: [""]
  variables:
    SOCKET_SECURITY_API_KEY: $SOCKET_SECURITY_API_KEY
    GITLAB_TOKEN: $GITLAB_TOKEN
  allow_failure: false
  #hardcoded 0 instead of ${CI_MERGE_REQUEST_IID:-0} for ommiting MR comments
  interruptible: false
  script:
    - |
      socketcli \
        --target-path $CI_PROJECT_DIR \
        --scm gitlab \
        --pr-number 0  
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_SOCKET == "true"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "**/package.json"
        - "**/package-lock.json"
        - "**/pom.xml"
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - "**/package.json"
        - "**/package-lock.json"
        - "**/pom.xml"
    - when: never


snyk-scan-frontend:
  stage: security
  image: 
    name: student-harbor.tn.internal/docker-remote/node:24-alpine
  needs:
    - job: frontend:build
      artifacts: true
  variables:
    SNYK_API: "https://api.eu.snyk.io"
  interruptible: false
  before_script:
    - npm install -g snyk snyk-to-html
    - echo "Token starts with $(echo $SNYK_TOKEN | cut -c1-4)..."
  script:
    - snyk test --file=frontend/package.json --json-file-output=snyk_data_file.json || true
    - snyk-to-html -i snyk_data_file.json -o snyk_results.html
    - snyk monitor --file=frontend/package.json --target-reference="$CI_COMMIT_REF_NAME"
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: npm
    paths:
      - frontend/node_modules/
    policy: pull
  artifacts:
    when: always
    paths:
      - snyk_data_file.json
      - snyk_results.html
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_SNYK == "true"
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: false



# ─────────────────────────────────────────
# IMAGES STAGE
# ─────────────────────────────────────────
images-backend:
  stage: images
  image: student-harbor.tn.internal/docker-remote/mgoltzsche/podman:minimal
  needs:
    - job: backend:build
      artifacts: true
    - job: backend:test
  dependencies:
    - backend:build
  interruptible: false
  script:
    - echo "Prepare images for backend"
    - ls -al
    - cd ./backend
    - whoami
    - id
    - podman info
    - podman build --storage-driver=vfs --root $HOME/.local/share/containers/vfs-storage/ -f ./docker/Dockerfile -t $IMG_PUSH_BE_REPO:$IMG_TAG .
    - echo "Now pushing to $IMAGEPUSHREGISTRY with user $BUILDUSR"
    - podman login $IMAGEPUSHREGISTRY --username $BUILDUSR --password $BUILDUSR_PWD
    - podman push --storage-driver=vfs --root $HOME/.local/share/containers/vfs-storage/ $IMG_PUSH_BE_REPO:$IMG_TAG
  rules:
    - if: '$BUILD_DOCKER_IMAGES == "true"'
      when: on_success
    - when: never
    

images-frontend:
  stage: images
  image: student-harbor.tn.internal/docker-remote/mgoltzsche/podman:minimal
  needs:
    - job: frontend:build
      artifacts: true
      # currently frontend tests are allowed to fail, in future make those tests tighter
    - job: frontend:test
  dependencies:
    - frontend:build
  interruptible: false
  script:
    - echo "Prepare images for frontend"
    - cd ./frontend
    - whoami
    - id
    - podman info
    - podman build --storage-driver=vfs --root $HOME/.local/share/containers/vfs-storage/ -f ./docker/Dockerfile -t $IMG_PUSH_FE_REPO:$IMG_TAG .
    - echo "Now pushing to $IMAGEPUSHREGISTRY with user $BUILDUSR"
    - podman login $IMAGEPUSHREGISTRY --username $BUILDUSR --password $BUILDUSR_PWD
    - podman push --storage-driver=vfs --root $HOME/.local/share/containers/vfs-storage/ $IMG_PUSH_FE_REPO:$IMG_TAG
  rules:
    - if: '$BUILD_DOCKER_IMAGES == "true"'
      when: on_success
    - when: never

