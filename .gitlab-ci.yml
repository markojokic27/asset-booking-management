stages:
  - compile
  - test
  - security
  - bruno
  - sonar
  - dockerize



variables:
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  DOCKER_HOST: tcp://docker:2375      # non-TLS port
  DOCKER_TLS_CERTDIR: ""              # TLS disabled
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task



# ─────────────────────────────────────────
# DEBUG (develop only — remove when stable)
# ─────────────────────────────────────────
debug:vars:
  stage: .pre
  image: alpine
  script:
    - echo "CI_REGISTRY=$CI_REGISTRY"
    - echo "CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE"
    - echo "CI_REGISTRY_USER=$CI_REGISTRY_USER"
    - echo "CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"



# ─────────────────────────────────────────
# COMPILE STAGE
# ─────────────────────────────────────────
backend:compile:
  stage: compile
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn clean package -DskipTests -Dmaven.repo.local=.m2/repository 
  artifacts:
    paths:
      - backend/target/
    expire_in: 1 hour
  cache:
    key: maven-$CI_PROJECT_ID
    paths:
      - backend/.m2/repository/



frontend:compile:
  stage: compile
  image: node:24-alpine
  script:
    - cd frontend
    - npm ci --legacy-peer-deps
    - npm run build
  artifacts:
    paths:
      - frontend/dist/        
    expire_in: 1 hour
  cache:
    key: npm-$CI_PROJECT_ID
    paths:
      - frontend/node_modules/  


# ─────────────────────────────────────────
# TEST STAGE
# ─────────────────────────────────────────
backend:test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  needs:
    - job: backend:compile
  script:
    - cd backend
    - mvn verify -Dmaven.repo.local=.m2/repository -Ddependency-check.skip=true
  artifacts:
    reports:
      junit: backend/target/surefire-reports/*.xml
    when: always
  cache:
    key: maven-$CI_PROJECT_ID
    paths:
      - backend/.m2/repository/



frontend:test:
  stage: test
  image: node:24-alpine
  needs:
    - job: frontend:compile
  script:
    - cd frontend
    - npm ci --legacy-peer-deps   
    - npm run test -- --watchAll=false --ci
  allow_failure: true
  cache:
    key: npm-$CI_PROJECT_ID
    paths:
      - frontend/node_modules/


# ─────────────────────────────────────────
# SECURITY STAGE
# ─────────────────────────────────────────
dependency-check:
  stage: security
  image: maven:3.9-eclipse-temurin-21
  needs:
    - job: backend:compile    # Reuses backend/target/ artifact, skips recompile
  script:
    - cd backend
    - mvn dependency-check:check
        -Dnvd.api.key=$NVD_API_KEY
        -Dmaven.repo.local=.m2/repository
  artifacts:
    when: always              # Save report even if CVSS ≥7 fails job
    paths:
      - backend/target/dependency-check-report/dependency-check-report.html
      - backend/target/dependency-check-report/dependency-check-report.json
    expire_in: 7 days
  cache:
    key: maven-$CI_PROJECT_ID
    paths:
      - backend/.m2/repository/
  allow_failure: true         # Don't block dockerize on first runs
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"   # Auto on nightly schedule
    - if: $CI_COMMIT_BRANCH == "main"         # Always on main branch
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual                            # Manual button on develop


# ─────────────────────────────────────────
# BRUNO STAGE
# ─────────────────────────────────────────
bruno:smoke:
  stage: bruno
  image: node:24-alpine
  # needs:
    # - job: backend:test
  services: []
  variables:
    BRUNO_BASE_URL: "http://localhost:8080/API"
    BRUNO_ENV: "Employee"   # select environment for testing e.g "Admin", "Employee", or "Manager" 
  before_script:
    - apk add --no-cache openjdk21-jre maven curl
    - echo "Installing Bruno CLI"
    - npm install -g @usebruno/cli   # Bruno CLI for running collections in CI 
  script:
    # 1) Start backend (Spring Boot) in background
    - echo "Starting backend API..."
    - cd backend
    - mvn -q spring-boot:run -Dspring-boot.run.profiles=dev &
    - BACKEND_PID=$!
    - cd ..
    # 2) Wait for login endpoint to be ready
    - echo "Waiting for backend at ${BRUNO_BASE_URL}/v1/auth/login"
    - |
      for i in $(seq 1 30); do
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${BRUNO_BASE_URL}/v1/auth/login" || echo "000")
        if echo "$STATUS" | grep -qE "200|400|401|403|404|405"; then
          echo "Backend is up (got HTTP $STATUS)."
          break
        fi
        echo "Backend not ready yet (status $STATUS), retry $i/30..."
        sleep 2
      done
    # 3) Run Bruno smoke tests from Testing collection
    - cd tests/api-tests/bruno/Testing
    - |
      bru run \
        --env "${BRUNO_ENV}" \
        --reporter-junit "../../../bruno-smoke-results.xml"
  after_script:
    - if [ -n "${BACKEND_PID:-}" ]; then kill $BACKEND_PID || true; fi
  artifacts:
    when: always
    reports:
      junit: tests/api-tests/bruno/bruno-smoke-results.xml
    paths:
      - tests/api-tests/bruno/bruno-smoke-results.xml
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'


# ─────────────────────────────────────────
# SONARQUBE STAGE
# ─────────────────────────────────────────
sonar:
  stage: sonar
  image: maven:3.9-eclipse-temurin-21
      
  script: 
    - cd backend
    - mvn clean verify 
        -Ddependency-check.skip=true 
        org.sonarsource.scanner.maven:sonar-maven-plugin:sonar 
        -Dsonar.projectKey=Asset-Booking-Manager-Backend 
        -Dsonar.projectName="Asset Booking Manager" 
        -Dsonar.host.url=$SONAR_HOST_URL 
        -Dsonar.token=$SONAR_TOKEN
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'

    



# ─────────────────────────────────────────
# DOCKERIZE STAGE
# ─────────────────────────────────────────
backend:dockerize:
  stage: dockerize
  image: quay.io/podman/stable
  services: []
  needs:
    - job: backend:compile
    - job: backend:test
  script:
    - echo "Prepare images for backend"
    - ls -al
    - cd ./backend
    - whoami
    - id
    - podman info
    - podman build --storage-driver=vfs --root $HOME/.local/share/containers/vfs-storage/ -f ./Dockerfile -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA .
    - echo "Now pushing to $CI_REGISTRY with user $CI_REGISTRY_USER"
    - echo "$CI_REGISTRY_PASSWORD" | podman login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - podman push --storage-driver=vfs --root $HOME/.local/share/containers/vfs-storage/ $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"


frontend:dockerize:
  stage: dockerize
  image: quay.io/podman/stable
  services: []
  needs:
    - job: frontend:compile
  before_script:
    - podman --storage-driver=vfs --root $HOME/.local/share/containers/vfs-storage/ info
    - echo "$CI_REGISTRY_PASSWORD" | podman login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - |
      podman build \
        --storage-driver=vfs \
        --root $HOME/.local/share/containers/vfs-storage/ \
        -f ./frontend/Dockerfile \
        -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA \
        -t $FRONTEND_IMAGE:latest \
        ./frontend
    - podman push --storage-driver=vfs --root $HOME/.local/share/containers/vfs-storage/ $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - podman push --storage-driver=vfs --root $HOME/.local/share/containers/vfs-storage/ $FRONTEND_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"