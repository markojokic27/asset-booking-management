stages:
  - build
  - test
  - bruno
  - security
  # - sonar      # blocked: runner network access to SonarQube (192.168.x.x) — see issue #42
  # - dast       # blocked: FF_NETWORK_PER_BUILD runner config pending — see issue #43
  # - dockerize  # blocked: container registry provisioning pending

#variables:
  # ── Container image paths ──────────────────────────────────────────
  # Uncomment and update to your Harbor URL when dockerize stage is enabled
  # BACKEND_IMAGE:  harbor.your-company.com/ci-images/backend
  # FRONTEND_IMAGE: harbor.your-company.com/ci-images/frontend
  # DOCKER_HOST: tcp://docker:2375      # non-TLS port
  # DOCKER_TLS_CERTDIR: ""              # TLS disabled
  #SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache

default:
  interruptible: false

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^(feature|refactor|fix|hotfix|test)\//'


# ── Auto on protected branches/MRs, invisible elsewhere
.standard_rules: &standard_rules
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == "main"'
  - if: '$CI_COMMIT_BRANCH == "develop"'
  - if: '$CI_COMMIT_BRANCH =~ /^(feature|refactor|fix|hotfix|test)\//'

# ── Auto on protected branches/MRs, MANUAL button on feature-type branches
.standard_rules_manual: &standard_rules_manual
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    when: on_success
  - if: '$CI_COMMIT_BRANCH == "main"'
    when: on_success
  - if: '$CI_COMMIT_BRANCH == "develop"'
    when: on_success
  - if: '$CI_COMMIT_BRANCH =~ /^(feature|refactor|fix|hotfix|test)\//'
    when: manual
    allow_failure: true


# ─────────────────────────────────────────
# BUILD STAGE
# ─────────────────────────────────────────
backend:build:
  stage: build
  image: 
    name: maven:3.9-eclipse-temurin-21
    # pull_policy: if-not-present
  script:
    - cd backend
    - mvn clean package -DskipTests -Dmaven.repo.local=.m2/repository 
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 hour
  cache:
    key:
      files:
        - backend/pom.xml
      prefix: maven
    paths:
      - backend/.m2/repository/
  rules: *standard_rules
   

frontend:build:
  stage: build
  image: 
    name: node:24-alpine
    # pull_policy: if-not-present
  script:
    - cd frontend
    - npm ci --legacy-peer-deps
    - npm run build
  artifacts:
    paths:
      - frontend/dist/        
    expire_in: 1 hour
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: npm
    paths:
      - frontend/node_modules/ 
  rules: *standard_rules
   
  


# ─────────────────────────────────────────
# TEST STAGE
# ─────────────────────────────────────────
# 
backend:test:
  stage: test
  image: 
    name: maven:3.9-eclipse-temurin-21
    # pull_policy: if-not-present
  services:
    - name: postgres:18
      alias: postgres
      # pull_policy: if-not-present


  needs:
    - job: backend:build
      artifacts: true
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: $TEST_DB_PASSWORD
    TESTCONTAINERS_RYUK_DISABLED: "true"
    TESTCONTAINERS_HOST_OVERRIDE: postgres
    DOCKER_HOST: ""   # unset — no Docker daemon needed
  script:
    - cd backend
    - mvn verify -Dmaven.repo.local=.m2/repository -Ddependency-check.skip=true
  artifacts:
    reports:
      junit: backend/target/surefire-reports/*.xml
    when: always
  cache:
    key:
      files:
        - backend/pom.xml
      prefix: maven
    paths:
      - backend/.m2/repository/
    policy: pull
  rules: *standard_rules
      
  

frontend:test:
  stage: test
  image: 
    name: node:24-slim
    # pull_policy: if-not-present
  needs:
      - job: frontend:build
        artifacts: true
  script:
    - cd frontend
    - npm ci --legacy-peer-deps  
    - npx playwright install --with-deps chromium 
    - npm run test
  allow_failure: true
  cache:
      - key:
         files:
          - frontend/package-lock.json
         prefix: npm
        paths:
          - frontend/node_modules/
      - key: playwright-chromium-$CI_COMMIT_REF_SLUG
        paths:
          - /root/.cache/ms-playwright/
  rules: *standard_rules
      
  

# ─────────────────────────────────────────
# PLAYWRIGHT E2E (full-stack: backend + served frontend)
# ─────────────────────────────────────────
playwright:e2e:
  stage: test
  image: 
    name: mcr.microsoft.com/playwright/java:v1.59.0-jammy
    # pull_policy: if-not-present
  needs:
    - job: backend:build
      artifacts: true
    - job: frontend:build
      artifacts: true
  services:
    - name: postgres:18
      alias: postgres
      # pull_policy: if-not-present
  variables:
    E2E_BASE_URL: "http://localhost:5173"
    HEADLESS: "true"
    POSTGRES_DB: asset_mgm
    POSTGRES_USER: asset_mgm_user
    POSTGRES_PASSWORD: $BRUNO_DB_PASSWORD
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: asset_mgm
    DB_USER: asset_mgm_user
    DB_PASSWORD: $BRUNO_DB_PASSWORD
    JWT_SECRET: $BRUNO_JWT_SECRET
    JWT_EXPIRY_SECONDS: "3600"
    JWT_REFRESH_SECONDS: "86400"
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl python3
  script:
    # --- 1. Start backend ---
    - |
      cd backend
      mvn -q spring-boot:run \
        -Dspring-boot.run.profiles=dev \
        -Dmaven.repo.local=.m2/repository \
        -Dlogging.level.root=WARN \
        -Dspring.datasource.url=jdbc:postgresql://postgres:5432/${DB_NAME} \
        -Dspring.datasource.username=${DB_USER} \
        -Dspring.datasource.password=${DB_PASSWORD} \
        -Dapp.jwt.secret=${JWT_SECRET} \
        -Dapp.jwt.expirySeconds=${JWT_EXPIRY_SECONDS} \
        -Dapp.jwt.refreshSeconds=${JWT_REFRESH_SECONDS} \
        -Dmanagement.otlp.metrics.export.enabled=false \
        > /tmp/backend.log 2>&1 &
      echo $! > /tmp/backend.pid
      cd ..

    # --- 2. Wait for backend on actuator port 8081 (no curl needed) ---
    - |
      echo "Waiting for backend on port 8081..."
      for i in $(seq 1 40); do
        if (echo > /dev/tcp/localhost/8081) 2>/dev/null; then
          echo "Backend TCP port 8081 is open (attempt $i). Waiting 2s for actuator readiness..."
          sleep 2
          break
        fi
        echo "  attempt $i/40 — port not open yet, retrying in 3s..."
        sleep 3
        if [ "$i" = "40" ]; then
          echo "=== BACKEND FAILED TO START ==="
          cat /tmp/backend.log
          exit 1
        fi
      done

    # --- 3. Serve frontend with Python (no npm/node needed) ---
    - |
      echo "Serving frontend on :5173..."
      cd frontend/dist
      python3 -m http.server 5173 > /tmp/frontend.log 2>&1 &
      echo $! > /tmp/frontend.pid
      cd ../..

      echo "Waiting for frontend..."
      for i in $(seq 1 20); do
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/ || echo "000")
        if [ "$STATUS" != "000" ]; then
          echo "Frontend ready (HTTP $STATUS) at attempt $i."
          break
        fi
        echo "  attempt $i/20 — not ready yet, retrying..."
        sleep 1
        if [ "$i" = "20" ]; then
          echo "=== FRONTEND FAILED TO START ==="
          cat /tmp/frontend.log
          exit 1
        fi
      done

    # --- 4. Run E2E tests ---
    - |
      cd tests/e2e-tests
      mvn test \
        -DE2E_BASE_URL="${E2E_BASE_URL}" \
        -DHEADED="${HEADLESS}" \
        -Dmaven.repo.local=../../backend/.m2/repository

  after_script:
    - kill $(cat /tmp/backend.pid 2>/dev/null) 2>/dev/null || true
    - kill $(cat /tmp/frontend.pid 2>/dev/null) 2>/dev/null || true


  cache:
    - key:
        files:
          - backend/pom.xml
      paths:
        - backend/.m2/repository/
      policy: pull

    - key:
        files:
          - tests/e2e-tests/pom.xml
      paths:
        - tests/e2e-tests/.m2/repository/
      policy: pull

  allow_failure: false
  # rules:
  #   # 1. Scheduled pipelines (full regression)
  #   - if: $CI_PIPELINE_SOURCE == "schedule"

  #   # 2. MR targeting develop or main (pre-merge gate)
  #   - if: $CI_PIPELINE_SOURCE == "merge_request_event" &&
  #         ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" ||
  #          $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")

  #   # 3. Direct push to main/develop
  #   - if: $CI_COMMIT_BRANCH == "main"
  #     when: manual
  #   - if: $CI_COMMIT_BRANCH == "develop"
  #     when: manual

  artifacts:
    when: always
    reports:
      junit: tests/e2e-tests/target/surefire-reports/TEST-*.xml
    paths:
      - tests/e2e-tests/target/surefire-reports/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_E2E == "true"
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
      allow_failure: true
 


# ─────────────────────────────────────────
# BRUNO STAGE
# ─────────────────────────────────────────
bruno:smoke:
  stage: bruno
  image: 
    name: node:24-alpine
    # pull_policy: if-not-present
  services:
    - name: postgres:18
      alias: postgres
      # pull_policy: if-not-present
  variables:
    BRUNO_BASE_URL: "http://localhost:8080/API"
    BRUNO_ENV_FILE: "environments/Admin.yml"
    # PostgreSQL service container
    POSTGRES_DB: asset_mgm
    POSTGRES_USER: asset_mgm_user
    POSTGRES_PASSWORD: $BRUNO_DB_PASSWORD
    # Spring datasource
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: asset_mgm
    DB_USER: asset_mgm_user
    DB_PASSWORD: $BRUNO_DB_PASSWORD
    # JWT
    JWT_SECRET: $BRUNO_JWT_SECRET
    JWT_EXPIRY_SECONDS: "3600"
    JWT_REFRESH_SECONDS: "86400"

  before_script:
    - apk add --no-cache --quiet openjdk21-jre maven curl > /dev/null 2>&1
    - npm install -g @usebruno/cli@3.3.0 --silent 

  script:
    - cd backend
    - |
      mvn -q spring-boot:run \
        -Dspring-boot.run.profiles=dev \
        -Dmaven.repo.local=.m2/repository \
        > /tmp/backend.log 2>&1 &
      echo $! > /tmp/backend.pid
    - cd ..
    - |
      echo "Waiting for backend..."
      READY=0
      for i in $(seq 1 40); do
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${BRUNO_BASE_URL}/v1/auth/login" || echo "000")
        if echo "$STATUS" | grep -qE "200|400|401|403|404|405"; then
          echo "Backend is up (HTTP $STATUS)."
          READY=1
          break
        fi
        echo "Not ready (status $STATUS), retry $i/40..."
        sleep 3
      done
      if [ "$READY" = "0" ]; then
        echo "=== BACKEND FAILED TO START ==="
        cat /tmp/backend.log
        exit 1
      fi
    - cd tests/api-tests/bruno/Testing
    - |
      bru run \
        --env-file "${BRUNO_ENV_FILE}" \
        --reporter-junit ./bruno-smoke-results.xml

  after_script:
    # - echo "=== BACKEND LOG ===" && cat /tmp/backend.log || true
    # - kill $(cat /tmp/backend.pid 2>/dev/null) 2>/dev/null || true
    - echo "=== BACKEND LOG (INFO+ only) ==="
    # - grep -E " (INFO|WARN|ERROR) " /tmp/backend.log || true
    - awk '/ INFO / {print "\033[32m" $0 "\033[0m"} / WARN / {print "\033[33m" $0 "\033[0m"} / ERROR / {print "\033[31m" $0 "\033[0m"}' /tmp/backend.log || true
    - kill $(cat /tmp/backend.pid) 2>/dev/null || true

  

  cache:
      key:
        files:
          - backend/pom.xml
        prefix: maven
      paths:
        - backend/.m2/repository/
      policy: pull
  artifacts:
    when: always
    reports:
      junit: tests/api-tests/bruno/Testing/bruno-smoke-results.xml
    paths:
      - tests/api-tests/bruno/Testing/bruno-smoke-results.xml
  allow_failure: true
  rules: *standard_rules
  




# ─────────────────────────────────────────
# SECURITY STAGE
# ─────────────────────────────────────────
#backend owasp chech
backend-dependency-check:
  stage: security
  image: 
    name: maven:3.9-eclipse-temurin-21
    # pull_policy: if-not-present
  needs:
    - job: backend:build    # Reuses backend/target/ artifact, skips recompile
      artifacts: true
  script:
    - cd backend
    # GitHub is unreachable from Internal network, also this is backend dependency check, Js already included in npm audit
    - mvn clean verify -Powasp
        -Dnvd.api.key=$NVD_API_KEY
        -Dmaven.repo.local=.m2/repository
        -DretireJsAnalyzerEnabled=false 
  artifacts:
    when: always              # Save report even if CVSS ≥7 fails job
    paths:
      - backend/target/dependency-check-report/dependency-check-report.html
      - backend/target/dependency-check-report/dependency-check-report.json
    expire_in: 7 days
  cache:
    key:
      files:
        - backend/pom.xml
      prefix: maven
    paths:
      - backend/.m2/repository/
  allow_failure: false         # Don't block dockerize on first runs
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_OWASP == "true"  # Auto on nightly schedule
    - if: $CI_COMMIT_BRANCH == "main"         
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual                            # Manual button on develop
      allow_failure: true

#frontend security stage
frontend-package-vulnerabilities-check:
  stage: security
  image: 
    name: node:24-alpine
    # pull_policy: if-not-present
  needs:
    - job: frontend:build
  script:
    - cd frontend
    # - npm ci --legacy-peer-deps
    - npm audit --audit-level=high --omit=dev
  allow_failure: false        
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_OWASP == "true"  # nightly
    - if: $CI_COMMIT_BRANCH == "main"        
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true         
                          
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: npm
    paths:
      - frontend/node_modules/

#osv security stage, backend and frontend
osv-scanner:
  stage: security
  image:
    name: ghcr.io/google/osv-scanner:v1.9.1
    entrypoint: [""]
  script:
    - /osv-scanner --format json -r . > osv-report.json #|| true #when true is ommited, job fails on vulnerability
  artifacts:
    when: always
    paths:
      - osv-report.json
    expire_in: 7 days
  needs: [] 
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_OSV == "true"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"



#socket scan
socket-security:
  stage: security
  image:
    name: socketdev/cli:2.4.6
    entrypoint: [""]
    # pull_policy: if-not-present  # NOT GOOD PRACTICE, IMPLEMENTED BECAUSE OF LOW MEMORY ON GITLAB RUNNER
  variables:
    SOCKET_SECURITY_API_KEY: $SOCKET_SECURITY_API_KEY
    GITLAB_TOKEN: $GITLAB_TOKEN
  allow_failure: false
  #hardcoded 0 instead of ${CI_MERGE_REQUEST_IID:-0} for ommiting MR comments
  script:
    - |
      socketcli \
        --target-path $CI_PROJECT_DIR \
        --scm gitlab \
        --pr-number 0  
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_OSV == "true"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "**/package.json"
        - "**/package-lock.json"
        - "**/pom.xml"
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - "**/package.json"
        - "**/package-lock.json"
        - "**/pom.xml"
    - when: never


snyk-scan-frontend:
  stage: security
  image: 
    name: node:24-alpine
    # pull_policy: if-not-present
  needs:
    - job: frontend:build
      artifacts: true
  variables:
    SNYK_API: "https://api.eu.snyk.io"
  before_script:
    - npm install -g snyk snyk-to-html
    - echo "Token starts with $(echo $SNYK_TOKEN | cut -c1-4)..."
  script:
    - snyk test --file=frontend/package.json --json-file-output=snyk_data_file.json || true
    - snyk-to-html -i snyk_data_file.json -o snyk_results.html
    - snyk monitor --file=frontend/package.json --target-reference="$CI_COMMIT_REF_NAME"
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: npm
    paths:
      - frontend/node_modules/
    policy: pull
  artifacts:
    when: always
    paths:
      - snyk_data_file.json
      - snyk_results.html
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_SNYK == "true"
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true


