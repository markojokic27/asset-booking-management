stages:
  - compile
  - test
  - security
  - bruno
  #- sonar
  - dockerize



variables:
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  DOCKER_HOST: tcp://docker:2375      # non-TLS port
  DOCKER_TLS_CERTDIR: ""              # TLS disabled
  #SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  



# ─────────────────────────────────────────
# DEBUG (develop only — remove when stable)
# ─────────────────────────────────────────
debug:vars:
  stage: .pre
  image: alpine
  script:
    - echo "CI_REGISTRY=$CI_REGISTRY"
    - echo "CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE"
    - echo "CI_REGISTRY_USER=$CI_REGISTRY_USER"
    - echo "CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"



# ─────────────────────────────────────────
# COMPILE STAGE
# ─────────────────────────────────────────
backend:compile:
  stage: compile
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn clean package -DskipTests -Dmaven.repo.local=.m2/repository 
  artifacts:
    paths:
      - backend/target/
    expire_in: 1 hour
  cache:
    key: maven-$CI_PROJECT_ID
    paths:
      - backend/.m2/repository/



frontend:compile:
  stage: compile
  image: node:24-alpine
  script:
    - cd frontend
    - npm ci --legacy-peer-deps
    - npm run build
  artifacts:
    paths:
      - frontend/dist/        
    expire_in: 1 hour
  cache:
    key: npm-$CI_PROJECT_ID
    paths:
      - frontend/node_modules/  


# ─────────────────────────────────────────
# TEST STAGE
# ─────────────────────────────────────────
backend:test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  needs:
    - job: backend:compile
  script:
    - cd backend
    - mvn verify -Dmaven.repo.local=.m2/repository -Ddependency-check.skip=true
  artifacts:
    reports:
      junit: backend/target/surefire-reports/*.xml
    when: always
  cache:
    key: maven-$CI_PROJECT_ID
    paths:
      - backend/.m2/repository/



frontend:test:
  stage: test
  image: node:24-alpine
  needs:
    - job: frontend:compile
  script:
    - cd frontend
    - npm ci --legacy-peer-deps   
    - npm run test -- --watchAll=false --ci
  allow_failure: true
  cache:
    key: npm-$CI_PROJECT_ID
    paths:
      - frontend/node_modules/


# ─────────────────────────────────────────
# SECURITY STAGE
# ─────────────────────────────────────────
backend-dependency-check:
  stage: security
  image: maven:3.9-eclipse-temurin-21
  needs:
    - job: backend:compile    # Reuses backend/target/ artifact, skips recompile
  script:
    - cd backend
    - mvn clean verify -Powasp
        -Dnvd.api.key=$NVD_API_KEY
        -Dmaven.repo.local=.m2/repository
        -DretireJsAnalyzerEnabled=false # GitHub is unreachable from Internal network, also this is backend dependency check, Js already included in npm audit
  artifacts:
    when: always              # Save report even if CVSS ≥7 fails job
    paths:
      - backend/target/dependency-check-report/dependency-check-report.html
      - backend/target/dependency-check-report/dependency-check-report.json
    expire_in: 7 days
  cache:
    key: maven-$CI_PROJECT_ID
    paths:
      - backend/.m2/repository/
  allow_failure: true         # Don't block dockerize on first runs
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"   # Auto on nightly schedule
    - if: $CI_COMMIT_BRANCH == "main"         
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual                            # Manual button on develop

#frontend security stage
frontend-package-vulnerabilities-check:
  stage: security
  image: node:24-alpine
  needs:
    - job: frontend:compile
  script:
    - cd frontend
    - npm ci --legacy-peer-deps
    - npm audit --audit-level=high --omit=dev
  allow_failure: true         # don't block on first runs
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"   # nightly
    - if: $CI_COMMIT_BRANCH == "main"        
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual                            
  cache:
    key: npm-$CI_PROJECT_ID
    paths:
      - frontend/node_modules/


# ─────────────────────────────────────────
# BRUNO STAGE
# ─────────────────────────────────────────
bruno:smoke:
  stage: bruno
  image: node:24-alpine
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    BRUNO_BASE_URL: "http://localhost:8080/API"
    BRUNO_ENV_FILE: "environments/Admin.yml"
    # PostgreSQL service container
    POSTGRES_DB: asset_mgm
    POSTGRES_USER: asset_mgm_user
    POSTGRES_PASSWORD: $BRUNO_DB_PASSWORD
    # Spring datasource
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: asset_mgm
    DB_USER: asset_mgm_user
    DB_PASSWORD: $BRUNO_DB_PASSWORD
    # JWT
    JWT_SECRET: $BRUNO_JWT_SECRET
    JWT_EXPIRY_SECONDS: "3600"
    JWT_REFRESH_SECONDS: "86400"

  before_script:
    # - apk add --no-cache openjdk21-jre maven curl
    # - npm install -g @usebruno/cli
    - apk add --no-cache --quiet openjdk21-jre maven curl > /dev/null 2>&1
    - npm install -g @usebruno/cli --silent

  script:
    - cd backend
    - |
      mvn -q spring-boot:run \
        -Dspring-boot.run.profiles=dev \
        -Dmaven.repo.local=.m2/repository \
        > /tmp/backend.log 2>&1 &
      echo $! > /tmp/backend.pid
    - cd ..
    - |
      echo "Waiting for backend..."
      READY=0
      for i in $(seq 1 40); do
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${BRUNO_BASE_URL}/v1/auth/login" || echo "000")
        if echo "$STATUS" | grep -qE "200|400|401|403|404|405"; then
          echo "Backend is up (HTTP $STATUS)."
          READY=1
          break
        fi
        echo "Not ready (status $STATUS), retry $i/40..."
        sleep 3
      done
      if [ "$READY" = "0" ]; then
        echo "=== BACKEND FAILED TO START ==="
        cat /tmp/backend.log
        exit 1
      fi
    - cd tests/api-tests/bruno/Testing
    - |
      bru run \
        --env-file "${BRUNO_ENV_FILE}" \
        --reporter-junit "../../../bruno-smoke-results.xml"

  after_script:
    # - echo "=== BACKEND LOG ===" && cat /tmp/backend.log || true
    # - kill $(cat /tmp/backend.pid 2>/dev/null) 2>/dev/null || true
    - echo "=== BACKEND LOG (INFO+ only) ==="
    - grep -E " (INFO|WARN|ERROR) " /tmp/backend.log || true
    - kill $(cat /tmp/backend.pid) 2>/dev/null || true

  artifacts:
    when: always
    reports:
      junit: tests/api-tests/bruno/Testing/bruno-smoke-results.xml
    paths:
      - tests/api-tests/bruno/Testing/bruno-smoke-results.xml
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'


