stages:
  - compile
  - test
  - dockerise

variables:
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  # PostgreSQL service config — mirrors your asset_mgm DB
  POSTGRES_DB: asset_mgm
  POSTGRES_USER: asset_mgm_user
  POSTGRES_PASSWORD: $DB_PASSWORD          # set this in GitLab → Settings → CI/CD → Variables

# ─────────────────────────────────────────
# COMPILE STAGE
# ─────────────────────────────────────────
backend:compile:
  stage: compile
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn clean compile -DskipTests -Dmaven.repo.local=.m2/repository
  artifacts:
    paths:
      - backend/target/           # passes compiled classes to test stage
    expire_in: 1 hour
  cache:
    key: maven-$CI_PROJECT_ID
    paths:
      - backend/.m2/repository/   # avoids re-downloading dependencies each run

frontend:compile:
  stage: compile
  image: node:24-alpine           # matches your FROM node:24.14-alpine
  script:
    - cd frontend
    - npm ci --legacy-peer-deps 
    - npm run build
  artifacts:
    paths:
      - frontend/dist/            # passes /dist to dockerise stage
    expire_in: 1 hour
  cache:
    key: npm-$CI_PROJECT_ID
    paths:
      - frontend/node_modules/

# ─────────────────────────────────────────
# TEST STAGE
# ─────────────────────────────────────────
backend:test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - name: postgres:18           # spins up a real PostgreSQL 18 instance
      alias: postgres
  variables:
    POSTGRES_HOST_AUTH_METHOD: md5
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/asset_mgm
    SPRING_DATASOURCE_USERNAME: asset_mgm_user
    SPRING_DATASOURCE_PASSWORD: $DB_PASSWORD
    # ensures your asset_booking_mgm schema is the default search path
    SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: asset_booking_mgm
    SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop   # creates schema fresh for each test run
  script:
    - cd backend
    - mvn test -Dmaven.repo.local=.m2/repository
  artifacts:
    reports:
      junit: backend/target/surefire-reports/*.xml   # shows test results directly in MR
    when: always                                       # upload report even on failure
  cache:
    key: maven-$CI_PROJECT_ID
    paths:
      - backend/.m2/repository/

frontend:test:
  stage: test
  image: node:24-alpine
  script:
    - cd frontend
    - npm ci
    - npm run test -- --watchAll=false --ci
  allow_failure: true     # matches your "TODO: Implement testing stage" in Dockerfile
  cache:
    key: npm-$CI_PROJECT_ID
    paths:
      - frontend/node_modules/

# ─────────────────────────────────────────
# DOCKERISE STAGE
# ─────────────────────────────────────────
backend:dockerise:
  stage: dockerise
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA \
        -t $BACKEND_IMAGE:latest \
        ./backend
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"

frontend:dockerise:
  stage: dockerise
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA \
        -t $FRONTEND_IMAGE:latest \
        ./frontend
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"