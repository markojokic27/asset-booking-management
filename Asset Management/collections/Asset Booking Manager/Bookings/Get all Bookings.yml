      params:
        - name: pageNumber
          value: "1"
          type: query
          description: The page number to return
        - name: perPage
          value: "10"
          type: query
          description: The number of items to return per Page
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "BAD_REQUEST",
            "message": "Invalid request data",
            "status": 400,
            "timestamp": {},
            "path": "/api/example",
            "details": [
              {
                "field": "email",
