info:
  name: Get all Bookings
  type: http
  seq: 1
  tags:
    - Bookings

http:
  method: GET
  url: "{{baseUrl}}/v1/bookings"
  params:
    - name: pageNumber
      value: "1"
      type: query
      description: The page number to return
    - name: perPage
      value: "10"
      type: query
      description: The number of items to return per Page
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/v1/bookings"
      method: GET
      params:
        - name: pageNumber
          value: "1"
          type: query
          description: The page number to return
        - name: perPage
          value: "10"
          type: query
          description: The number of items to return per Page
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 0,
              "userId": 0,
              "assetId": 0,
              "note": "",
              "status": "SUCCESSFUL",
              "bookingStart": "",
              "bookingEnd": "",
              "createdAt": "",
              "lastModifiedAt": ""
            }
          ]
  - name: 400 Response
    description: Bad request
    request:
