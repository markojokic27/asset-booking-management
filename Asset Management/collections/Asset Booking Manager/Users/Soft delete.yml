info:
  name: Soft delete
  type: http
  seq: 5
  tags:
    - Users

http:
  method: PATCH
  url: "{{baseUrl}}/v1/users/:id"
  params:
    - name: id
      value: ""
      type: path
      description: ID of the user
    - name: status
      value: INACTIVE
      type: query
      description: Set status to INACTIVE
  body:
    type: json
    data: |-
      {
        "note": "Left company or temporarly absent"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

