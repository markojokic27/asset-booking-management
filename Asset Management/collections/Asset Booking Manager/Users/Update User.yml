info:
  name: Update User
  type: http
  seq: 4
  tags:
    - Users

http:
  method: PUT
  url: "{{baseUrl}}/v1/users/:id"
  params:
    - name: id
      value: ""
      type: path
      description: ID of the user
  body:
    type: json
    data: |-
      {
        "username": "",
        "name": "",
        "surname": "",
        "email": "",
        "role": "EMPLOYEE",
        "status": "ACTIVE",
        "note": "",
        "departmentId": 0,
        "managerEmail": "",
        "benefit": "ALL"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

