info:
  name: Get Department by ID
  type: http
  seq: 3
  tags:
    - Departments

http:
  method: GET
  url: "{{baseUrl}}/v1/departments/:id"
  params:
    - name: id
      value: ""
      type: path
      description: ID of the department
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/v1/departments/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: ID of the department
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 0,
            "name": "",
            "managerId": 0,
            "createdAt": "",
            "lastModifiedAt": ""
          }
  - name: 400 Response
    description: Bad request
    request:
      url: "{{baseUrl}}/v1/departments/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: ID of the department
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "BAD_REQUEST",
            "message": "Invalid request data",
            "status": 400,
            "timestamp": {},
            "path": "/api/example",
            "details": [
              {
                "field": "email",
                "issue": "Invalid format"
              }
            ]
          }
  - name: 404 Response
    description: Not found
    request:
      url: "{{baseUrl}}/v1/departments/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: ID of the department
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "NOT_FOUND",
            "message": "Resource not found",
            "status": 404,
            "timestamp": {},
            "path": "/v1/example/123",
            "details": [
              {
                "field": "id",
                "issue": "Not found"
              }
            ]
          }
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/v1/departments/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: ID of the department
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "INTERNAL_ERROR",
            "message": "Something went wrong",
            "status": 500,
            "timestamp": {},
            "path": "/api/example",
            "details": [
              {
                "field": "example",
                "issue": "Example"
              }
            ]
          }
