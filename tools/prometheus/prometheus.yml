global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
     - targets: ["localhost:9090"]
  - job_name: postgres-exporter
    metrics_path: '/metrics'
    static_configs:
     - targets: ["postgres-exporter:9187"]
  - job_name: 'asset_booking_mgm'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8081']
    scrape_interval: 10s