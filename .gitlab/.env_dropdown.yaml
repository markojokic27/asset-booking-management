# ── Pipeline control panel ───────────────────────────────────────────
# These variables appear as dropdowns/fields on the "Run pipeline" page.
# On automatic pipelines (push, MR) only project/group CI/CD variables
# and predefined variables are visible to include:rules — the defaults
# below do NOT apply. That is intentional: toggles like BUILD_DOCKER_IMAGES
# should be opt-in (manual trigger only).

variables:
  RUN_PREPARE_BUILD:
    value: "true"
    options:
      - "true"
      - "false"
    description: "Run the prepare-build info job (prints Java, Maven, Node, OS versions)."
