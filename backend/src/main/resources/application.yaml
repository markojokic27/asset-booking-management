spring:
  application:
    name: assetbookingmanagement
    qr:
      directory: qrcodes
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 150
        one-indexed-parameters: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: asset_booking_mgm
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: asset_booking_mgm
    default-schema: asset_booking_mgm

  ldap:
    embedded:
      base-dn: dc=myapp,dc=com
      ldif: classpath:ldap/test-data.ldif
      port: 8389

  # For production — real LDAP server
  # ldap:
  #   urls: ldaps://ldap.internal.myapp.com:636
  #   base: dc=myapp,dc=com
  #   username: cn=readonly,dc=myapp,dc=com
  #   password: ${LDAP_PASSWORD}

feature:
  asset-name-validation-enabled: false

jwt:
  secret: ${JWT_SECRET}
  accessTokenExpiry: ${JWT_EXPIRY_SECONDS}
  refreshTokenExpiry: ${JWT_REFRESH_SECONDS}