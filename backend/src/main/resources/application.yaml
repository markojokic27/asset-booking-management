  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  

  ldap:
    embedded:
      base-dn: dc=myapp,dc=com
      ldif: classpath:ldap/test-data.ldif
      port: 8389

  # For production — real LDAP server
