spring:
  application:
    name: assetbookingmanagement
    qr:
      directory: qrcodes
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 150
        one-indexed-parameters: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: AssetBookingManagement
      maximum-pool-size: 20 # Scaled for 150 user booking bursts
      minimum-idle: 20 # Fixed-size for instant response
      connection-timeout: 5000 # Fail-fast to avoid hanging UI
      idle-timeout: 600000
      max-lifetime: 1800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    exposed-headers: ${CORS_EXPOSED_HEADERS:Authorization}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    max:age: ${CORS_MAX_AGE:3600}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: asset_booking_mgm
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: asset_booking_mgm
    default-schema: asset_booking_mgm

  ldap:
    embedded:
      base-dn: dc=myapp,dc=com
      ldif: classpath:ldap/test-data.ldif
      port: 8389

  # For production — real LDAP server
  # ldap:
  #   urls: ldaps://ldap.internal.myapp.com:636
  #   base: dc=myapp,dc=com
  #   username: cn=readonly,dc=myapp,dc=com
  #   password: ${LDAP_PASSWORD}

feature:
  asset-name-validation-enabled: false

jwt:
  secret: ${JWT_SECRET}
  accessTokenExpiry: ${JWT_EXPIRY_SECONDS}
  refreshTokenExpiry: ${JWT_REFRESH_SECONDS}

benefit:
  default-benefits:
    - LAPTOP
    - PARKING
    - BOOK
    - DESK
    - MEETING_ROOM
    - IT_EQUIPMENT
  benefit-delimiter: ";"

management:
  endpoints:
    web:
      exposure:
        include: "health, info, metrics, prometheus" # Handles what endpoints are available over HTTP
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
  server:
    port: 8081 # Management is on a different port
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:default}
      version: ${build.version:unknown}