app:
  frontend:
    base-url: ${BASE_URL}
spring:
  application:
    name: assetbookingmanagement
    qr:
      directory: qrcodes
  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 150
        one-indexed-parameters: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: AssetBookingManagement
      maximum-pool-size: 20 # Scaled for 150 user booking bursts
      minimum-idle: 20 # Fixed-size for instant response
      connection-timeout: 5000 # Fail-fast to avoid hanging UI
      idle-timeout: 600000
      max-lifetime: 1800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,DELETE,PATCH,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    exposed-headers: ${CORS_EXPOSED_HEADERS:Authorization}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    max-age: ${CORS_MAX_AGE:3600}    

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: asset_booking_mgm
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: asset_booking_mgm
    default-schema: asset_booking_mgm

#  mail:
