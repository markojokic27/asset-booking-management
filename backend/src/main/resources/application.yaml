  #   username: cn=readonly,dc=myapp,dc=com
  #   password: ${LDAP_PASSWORD}

feature:
  asset-name-validation-enabled: false

jwt:
  secret: ${JWT_SECRET}
  accessTokenExpiry: ${JWT_EXPIRY_SECONDS}
  refreshTokenExpiry: ${JWT_REFRESH_SECONDS}

benefit:
  default-benefits:
    - LAPTOP
    - PARKING
    - BOOK
    - DESK
    - MEETING ROOM
    - IT EQUIPMENT
  benefit-delimiter: ";"

booking:
  scheduler:
    cron: "0 0 19 * * *"
    zone: "UTC"

management:
  endpoints:
    web:
      exposure:
        include: "health, info, metrics, prometheus" # Handles what endpoints are available over HTTP
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
  server:
    port: 8081 # Management is on a different port
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:default}
      version: ${build.version:unknown}
  tracing:
    sampling:
      probability: ${SAMPLING_PROBABILITY:0.1}
  otlp:
    metrics:
      export:
        url: http://alloy:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://alloy:4318/v1/traces

rate-limit:
  endpoints:
    "POST:/v1/auth/login":
      capacity: 20
      refill-tokens: 20
      refill-period: 1m
    "POST:/v1/auth/refresh":
      capacity: 30
      refill-tokens: 30
      refill-period: 1m