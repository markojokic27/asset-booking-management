spring:
  application:
    name: assetbookingmanagement
  datasource:
    url: jdbc:postgresql://postgres:5432/testdb
    username: test
    password: test
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: asset_booking_mgm

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: asset_booking_mgm
    default-schema: asset_booking_mgm
    create-schemas: true