openapi: "3.1.0"
info:
  version: 1.0.0
  title: Asset Booking Manager
  license:
    name: MIT
servers:
  - url: http://demoVM.swagger.io/v1
security:
  - bearerAuth: []
paths:
  /v1/users:
    get:
      summary: Get all Users
      operationId: listUsers
      tags:
        - Users
      parameters:
        - name: pageNumber
          in: query
          description: The page number to return
          required: true
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage       # limit
          in: query
          description: The number of items to return per Page
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 150
            default: 10
      responses:
        200:
          description: OK
          content:
            application/json:    
              schema:
                $ref: "#/components/schemas/Users"
              examples:
                Users:
                  $ref: "#/components/examples/UsersExample"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      summary: Create a user
      operationId: createUsers
      tags:
        - Users
      responses:
        201:
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /users/{userId}:
    get:
      summary: Info for a specific user
      operationId: showUserById
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        200:
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Users"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1
    User:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string 
          minLength: 3
          maxLength: 20
        name:
          type: string
          minLength: 3
          maxLength: 50
        surname:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string 
          format: email
          examples: 
            - 'johndoe@gmail.com'
        role:
          enum: [EMPLOYEE, MANAGER]
        status:
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
        note:
          type: string
          maxLength: 256
        departmentId:
          $ref: '#/components/schemas/Id'
        managerEmail:
          type: string
          format: email
          examples: 
            - 'johndoe2@gmail.com'
        benefit:
          enum: [ALL, REC_PARK]
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
    Users:
      type: array
      items:
        $ref: "#/components/schemas/User"
    Department:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 2
          maxLength: 50
        managerId:
          $ref: '#/components/schemas/Id'
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
      required:
        - id 
        - name 
        - managerId
    Departments:
      type: array 
      items:
        $ref: '#/components/schemas/Department'
    AssetCategory:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 2
          maxLength: 50
        description:
          type: string
          minLength: 2
          maxLength: 256
        bookingPeriod:
          enum: [HOUR, DAY, WEEK, MONTH]
        approval:
          type: boolean 
          default: false
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
      required:
        - id 
        - name
        - bookingPeriod
    AssetCategories:
      type: array
      items:
        $ref: '#/components/schemas/AssetCategory'
    Asset:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 2
          maxLength: 50
        categoryId:
          $ref: '#/components/schemas/Id'
        description:
          type: string
          minLength: 2
          maxLength: 256
        code:
          type: string 
        status:
          enum: [AVAILABLE, UNAVAILABLE]
          # change type to boolean (e.g. available: true/false)
        location:
          type: string 
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
      required:
        - id
        - categoryId
        - name
    Assets:
      type: array
      items:
        $ref: '#/components/schemas/Asset'
    Booking:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        userId:
          $ref: '#/components/schemas/Id'
        assetId:
          $ref: '#/components/schemas/Id'
        note:
          type: string
          maxLength: 256
        status:
          enum: [SUCCESSFUL, PENDING, REJECTED]
        timestampStart:
          type: string 
          format: date-time
        timestampEnd:
          type: string 
          format: date-time
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - assetId 
        - timestampStart
        - timestampEnd
    Bookings:
      type: array
      items:
        $ref: '#/components/schemas/Booking'
    ApiError:
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdParam:
      name: id         
      in: path          
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  responses:
  examples:
    UsersExample:
      value:
        - id: 1
          username: "johndoe"
          name: "John"
          surname: "Doe"
          email: "johndoe@gmail.com"
          role: EMPLOYEE
          status: ACTIVE
          note: "This is a note about John."
          departmentId: 101
          managerEmail: "manager1@example.com"
          benefit: ALL
          createdAt: "2026-03-24T10:00:00Z"
          lastModifiedAt: "2026-03-24T12:00:00Z"