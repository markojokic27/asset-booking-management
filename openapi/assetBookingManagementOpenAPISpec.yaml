components:
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
    DepartmentRequestDTO:
      type: object
      properties:
        name:
          type: string
          enum:
          - ADVANCE_TECHNOLOGY
          - SECURE_SERVICES
          - ARCHITECTURE
          - FINANCE_AND_BUSINESS_ADMINISTRATION
          - MOBILE_AND_SECURITY
          - SYSTEM_TEST
          - HUMAN_RESOURCES
          - CLOUD_AND_DATA_MANAGEMENT
          - DEVOPS
        managerId:
          type: integer
          format: int64
      required:
      - name
    DepartmentResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          enum:
          - ADVANCE_TECHNOLOGY
          - SECURE_SERVICES
          - ARCHITECTURE
          - FINANCE_AND_BUSINESS_ADMINISTRATION
          - MOBILE_AND_SECURITY
          - SYSTEM_TEST
          - HUMAN_RESOURCES
          - CLOUD_AND_DATA_MANAGEMENT
          - DEVOPS
        managerId:
          type: integer
          format: int64
    BookingUpdateDTO:
      type: object
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - CANCELLED
          - PENDING
          - APPROVED
          - REJECTED
          - DELETED
        bookingStart:
          type: string
          format: date-time
        bookingEnd:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 1000
          minLength: 0
    BookingResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
