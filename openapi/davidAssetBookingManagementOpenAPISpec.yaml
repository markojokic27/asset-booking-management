openapi: "3.1.0"
info:
  version: 1.0.0
  title: Asset Booking Manager
  description:
    "The Asset Booking Manager API allows users to discover, reserve, and manage
    \ shared assets such as meeting rooms, vehicles, devices, and other equipment
    \ within an organization. It exposes endpoints for searching assets by type
    \ and availability, creating and updating reservations, and enforcing booking
    \ rules and time windows for different asset categories. Consumers can
    \ integrate this API into internal portals or mobile apps to streamline
    \ scheduling, prevent double-bookings, and improve overall asset utilization
    \ through centralized, auditable booking workflows."
servers:
  - url: http://demo.swagger.io/v1
    description: Demo server
  - url: http://prod.swagger.io/v1
    description: Production server
security:
  - bearerAuth: []
paths:
  /api/v1/users:
    get:
      summary: Get all Users
      operationId: listUsers
      tags:
        - Users
      parameters:
        - name: pageNumber
          in: query
          description: The page number to return
          required: true
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage       # limit
          in: query
          description: The number of items to return per Page
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 150
            default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:    
              schema:
                $ref: "#/components/schemas/Users"
              examples:
                Users:
                  $ref: "#/components/examples/UsersExample"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    
  /api/v1/users/{id}:
    get:
      summary: Get User by ID
      operationId: getUserById
      tags:
        - Users
      parameters:
        - name: id
          in: path
          description: ID of the user
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      summary: Partially update User
      description: Use this to deactivate a user by setting status to INACTIVE.
      operationId: patchUser
      tags:
        - Users
      parameters:
        - name: id
          in: path
          description: ID of the user
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                note:
                  type: string
                  maxLength: 256
              additionalProperties: false
            examples:
              DeactivateUser:
                summary: Soft delete (deactivate) user
                value:
                  status: INACTIVE
                  note: "Left company or temporarly absent"
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                User:
                  $ref: '#/components/examples/SingleUserExample'
        '404':
          description: User not found
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'


  /api/v1/departments:
    get:
      summary: Get all Departments
      operationId: listDepartments
      tags:
        - Departments
      parameters:
        - name: pageNumber
          in: query
          description: The page number to return
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          description: The number of items to return per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 150
            default: 10
      responses:
        '200':
          description: List of departments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departments'
              examples:
                Departments:
                  $ref: '#/components/examples/DepartmentsExample'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    post:
      summary: Create Department
      operationId: createDepartment
      tags:
        - Departments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department'
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/departments/{id}:
    get:
      summary: Get Department by ID
      operationId: getDepartmentById
      tags:
        - Departments
      parameters:
        - name: id
          in: path
          description: ID of the department
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Department found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '404':
          description: Department not found
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    put:
      summary: Update Department
      operationId: updateDepartment
      tags:
        - Departments
      parameters:
        - name: id
          in: path
          description: ID of the department
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department'
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
              examples:
                Department:
                  $ref: "#/components/examples/DepartmentExample" 
        '404':
          description: Department not found
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/asset-categories:
    get:
      summary: Get all Asset Categories
      operationId: listAssetCategories
      tags:
        - Asset Categories
      parameters:
        - name: pageNumber
          in: query
          description: The page number to return
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          description: The number of items to return per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 150
            default: 10
      responses:
        '200':
          description: List of asset categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCategories'
              examples:
                AssetCategories:
                  $ref: '#/components/examples/AssetCategoriesExample'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    post:
      summary: Create Asset Category
      operationId: createAssetCategory
      tags:
        - Asset Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCategory'
      responses:
        '201':
          description: Asset category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCategory'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/asset-categories/{id}:
    get:
      summary: Get Asset Category by ID
      operationId: getAssetCategoryById
      tags:
        - Asset Categories
      parameters:
        - name: id
          in: path
          description: ID of the asset category
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Asset category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCategory'
              examples:
                AssetCategory:
                  $ref: '#/components/examples/AssetCategoryExample'
        '404':
          description: Asset category not found
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    put:
      summary: Update Asset Category
      operationId: updateAssetCategory
      tags:
        - Asset Categories
      parameters:
        - name: id
          in: path
          description: ID of the asset category
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCategory'
      responses:
        '200':
          description: Asset category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCategory'
        '404':
          description: Asset category not found
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    delete:
      summary: Delete Asset Category
      description: Deletes an asset category or marks it as inactive (implementation-specific).
      operationId: deleteAssetCategory
      tags:
        - Asset Categories
      parameters:
        - name: id
          in: path
          description: ID of the asset category
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Asset category deleted
        '404':
          description: Asset category not found
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1
    User:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string 
          minLength: 3
          maxLength: 20
        name:
          type: string
          minLength: 3
          maxLength: 50
        surname:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string 
          format: email
          examples: 
            - 'johndoe@gmail.com'
        role:
          enum: [EMPLOYEE, MANAGER]
        status:
          enum: [ACTIVE, INACTIVE]
          default: ACTIVE
        note:
          type: string
          maxLength: 256
        departmentId:
          $ref: '#/components/schemas/Id'
        managerEmail:
          type: string
          format: email
          examples: 
            - 'johndoe2@gmail.com'
        benefit:
          enum: [ALL, REC_PARK]
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
    Users:
      type: array
      items:
        $ref: "#/components/schemas/User"
    Department:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 2
          maxLength: 50
        managerId:
          $ref: '#/components/schemas/Id'
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
      required:
        - id 
        - name 
        - managerId
    Departments:
      type: array 
      items:
        $ref: '#/components/schemas/Department'
    AssetCategory:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 2
          maxLength: 50
        description:
          type: string
          minLength: 2
          maxLength: 256
        bookingPeriod:
          enum: [HOUR, DAY, WEEK, MONTH]
        approval:
          type: boolean 
          default: false
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
      required:
        - id 
        - name
        - bookingPeriod
    AssetCategories:
      type: array
      items:
        $ref: '#/components/schemas/AssetCategory'
    Asset:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 2
          maxLength: 50
        categoryId:
          $ref: '#/components/schemas/Id'
        description:
          type: string
          minLength: 2
          maxLength: 256
        code:
          type: string 
        status:
          enum: [AVAILABLE, UNAVAILABLE]
          # change type to boolean (e.g. available: true/false)
        location:
          type: string 
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
      required:
        - id
        - categoryId
        - name
    Assets:
      type: array
      items:
        $ref: '#/components/schemas/Asset'
    Booking:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        userId:
          $ref: '#/components/schemas/Id'
        assetId:
          $ref: '#/components/schemas/Id'
        note:
          type: string
          maxLength: 256
        status:
          enum: [SUCCESSFUL, PENDING, REJECTED]
        timestampStart:
          type: string 
          format: date-time
        timestampEnd:
          type: string 
          format: date-time
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - assetId 
        - timestampStart
        - timestampEnd
    Bookings:
      type: array
      items:
        $ref: '#/components/schemas/Booking'
    ApiError:
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdParam:
      name: id         
      in: path          
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  responses:
  examples:
    UsersExample:
      value:
        - id: 1
          username: "johndoe"
          name: "John"
          surname: "Doe"
          email: "johndoe@gmail.com"
          role: EMPLOYEE
          status: ACTIVE
          note: "This is a note about John DOE."
          departmentId: 101
          managerEmail: "manager1@example.com"
          benefit: ALL
          createdAt: "2026-03-24T10:00:00Z"
          lastModifiedAt: "2026-03-24T12:00:00Z"
        - id: 2
          username: "johnsmith"
          name: "John"
          surname: "Smith"
          email: "johnsmith@gmail.com"
          role: EMPLOYEE
          status: ACTIVE
          note: "This is a note about John Smith."
          departmentId: 101
          managerEmail: "manager1@example.com"
          benefit: ALL
          createdAt: "2026-03-24T10:00:00Z"
          lastModifiedAt: "2026-03-24T12:00:00Z"
    SingleUserExample:
      value:
        - id: 1
          username: "johndoe"
          name: "John"
          surname: "Doe"
          email: "johndoe@gmail.com"
          role: EMPLOYEE
          status: ACTIVE
          note: "This is a note about John DOE."
          departmentId: 101
          managerEmail: "manager1@example.com"
          benefit: ALL
          createdAt: "2026-03-24T10:00:00Z"
          lastModifiedAt: "2026-03-24T12:00:00Z"

    DepartmentExample:
      summary: Single department
      value:
        id: 10
        name: "Engineering"
        managerId: 3
        createdAt: "2026-03-24T10:00:00Z"
        lastModifiedAt: "2026-03-24T12:00:00Z"

    DepartmentsExample:
      summary: List of departments
      value:
        - id: 10
          name: "Engineering"
          managerId: 3
          createdAt: "2026-03-24T10:00:00Z"
          lastModifiedAt: "2026-03-24T12:00:00Z"
        - id: 20
          name: "Human Resources"
          managerId: 5
          createdAt: "2026-03-20T09:30:00Z"
          lastModifiedAt: "2026-03-22T14:15:00Z"

    AssetCategoryExample:
      summary: Single asset category
      value:
        id: 1
        name: "Conference Rooms"
        description: "Meeting rooms equipped with projector and whiteboard"
        bookingPeriod: HOUR
        approval: true
        createdAt: "2026-03-01T08:00:00Z"
        lastModifiedAt: "2026-03-10T09:30:00Z"

    AssetCategoriesExample:
      summary: List of asset categories
      value:
        - id: 1
          name: "Conference Rooms"
          description: "Meeting rooms equipped with projector and whiteboard"
          bookingPeriod: HOUR
          approval: true
          createdAt: "2026-03-01T08:00:00Z"
          lastModifiedAt: "2026-03-10T09:30:00Z"
        - id: 2
          name: "Company Cars"
          description: "Pool vehicles available for business trips"
          bookingPeriod: DAY
          approval: false
          createdAt: "2026-02-15T10:15:00Z"
          lastModifiedAt: "2026-02-20T11:45:00Z"